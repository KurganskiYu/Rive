<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuri's Rive Animations</title>
    <script src="https://unpkg.com/@rive-app/webgl2@2.39.2"></script>
    <!-- Add Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../RiveIcon2.svg" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="animation-wrapper">

    <div style="position:fixed; top:10px; right:10px; z-index:9999; display:flex; flex-direction:column; align-items:center;">
        <canvas id="bg_button_canvas" width="80" height="80"></canvas>
    </div>
    <script>
      (function() {
        function updatePageBg(mode) {
            const body = document.body;
            const label = document.getElementById("bg_debug_label");
            if (label) label.textContent = "bg: " + mode;
            console.log("[BG] updatePageBg called with mode:", mode);
            if (mode === 1) {
                // Checkered pattern
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage =
                    "repeating-conic-gradient(#0f0f0f 0% 25%, transparent 0% 50%)";
                body.style.backgroundSize = "20px 20px";
                body.style.backgroundPosition = "";
            } else if (mode === 2) {
                // Solid black
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            } else if (mode === 3) {
                // Solid dark gray
                body.style.backgroundColor = "#121212";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            }
        }

        // Apply stored background immediately (before Rive loads)
        let storedBg = localStorage.getItem("page_bg_mode");
        if (storedBg) {
            updatePageBg(parseInt(storedBg));
        }

        const bgRive = new rive.Rive({
          src: "../bg_button.riv",
          canvas: document.getElementById("bg_button_canvas"),
          autoplay: true,
          artboard: "main",
          autoBind: true,
          stateMachines: "State Machine 1",
          onLoad: () => {
            bgRive.resizeDrawingSurfaceToCanvas();
            console.log("[BG] Rive loaded");
            const vmi = bgRive.viewModelInstance;
            console.log("[BG] viewModelInstance:", vmi);
            if (vmi) {
                const bgNum = vmi.number("bgNum");
                console.log("[BG] bgNum property:", bgNum);
                if (bgNum) {
                    // Initialize based on current stored state or default
                    let storedBg = localStorage.getItem("page_bg_mode");
                    let mode = storedBg ? parseInt(storedBg) : 1;
                    bgNum.value = mode;
                    updatePageBg(mode);
                    console.log("[BG] Initial mode set to:", mode, "bgNum.value:", bgNum.value);

                    // Listen for changes from Rive
                    bgNum.onValueChanged = (val) => {
                        console.log("[BG] onValueChanged fired:", val);
                        updatePageBg(val);
                        localStorage.setItem("page_bg_mode", String(val));
                    };

                    // Polling fallback: check bgNum.value periodically
                    let lastVal = bgNum.value;
                    setInterval(() => {
                        const cur = bgNum.value;
                        if (cur !== lastVal) {
                            console.log("[BG] poll detected change:", lastVal, "->", cur);
                            lastVal = cur;
                            updatePageBg(cur);
                            localStorage.setItem("page_bg_mode", String(cur));
                        }
                    }, 200);
                }
            }
          } }); 
      })();
    </script>
    
      <div class="animation-container detail-animation">
        <canvas id="main_canvas" width="375" height="812"></canvas>
        <div class="description">
          <div style="display:flex;align-items:center;width:100%;">
            <div><span style="white-space: nowrap;"><a href="../riv/36_PaywallWave_v18.riv" target="_blank" style="color: white;">36 PaywallWave</a><span class="riv-file-size">&nbsp&nbsp;108 KB</span></span></div>
            
          </div>
          Size: 375px × 812px<br>State Machine: State Machine 1<br>Artboard: main<br>Note: Scripting for wave<br>Input: v_num:rotation(0:0-360)<br>
          <div class="controls-column" style="margin-top:8px;">
        <div class="range-control" style="width:100%;--slider-progress:0.0000%;">
            <output for="btn_main_input0">0</output>
            <span class="range-ticks" aria-hidden="true"><span style="left:2.22222222%;"></span><span style="left:4.44444444%;"></span><span style="left:6.66666667%;"></span><span style="left:8.88888889%;"></span><span style="left:11.11111111%;"></span><span style="left:13.33333333%;"></span><span style="left:15.55555556%;"></span><span style="left:17.77777778%;"></span><span style="left:20.00000000%;"></span><span style="left:22.22222222%;"></span><span style="left:24.44444444%;"></span><span style="left:26.66666667%;"></span><span style="left:28.88888889%;"></span><span style="left:31.11111111%;"></span><span style="left:33.33333333%;"></span><span style="left:35.55555556%;"></span><span style="left:37.77777778%;"></span><span style="left:40.00000000%;"></span><span style="left:42.22222222%;"></span><span style="left:44.44444444%;"></span><span style="left:46.66666667%;"></span><span style="left:48.88888889%;"></span><span style="left:51.11111111%;"></span><span style="left:53.33333333%;"></span><span style="left:55.55555556%;"></span><span style="left:57.77777778%;"></span><span style="left:60.00000000%;"></span><span style="left:62.22222222%;"></span><span style="left:64.44444444%;"></span><span style="left:66.66666667%;"></span><span style="left:68.88888889%;"></span><span style="left:71.11111111%;"></span><span style="left:73.33333333%;"></span><span style="left:75.55555556%;"></span><span style="left:77.77777778%;"></span><span style="left:80.00000000%;"></span><span style="left:82.22222222%;"></span><span style="left:84.44444444%;"></span><span style="left:86.66666667%;"></span><span style="left:88.88888889%;"></span><span style="left:91.11111111%;"></span><span style="left:93.33333333%;"></span><span style="left:95.55555556%;"></span><span style="left:97.77777778%;"></span></span>
            <input type="range" id="btn_main_input0" value="0" min="0" max="360" step="1" aria-label="rotation" />
            <span class="range-hint" aria-hidden="true">rotation</span>
            <span class="range-bound range-min">0</span>
            <span class="range-bound range-max">360</span>
        </div>
        </div>
        </div>
      </div>
<script>

const mainRive = new rive.Rive({
  src: "../riv/36_PaywallWave_v18.riv",
  canvas: document.getElementById("main_canvas"),
  autoplay: true,autoBind: true, artboard: "main", stateMachines: "State Machine 1",
  

  onLoad: () => {
    mainRive.resizeDrawingSurfaceToCanvas();
    const vmi = mainRive.viewModelInstance;
    let inputFieldBtn_Main_0 = document.getElementById("btn_main_input0");
    if (inputFieldBtn_Main_0 && vmi) {
      // Update numeric ViewModel variable
      inputFieldBtn_Main_0.addEventListener("input", () => {
        let val = parseFloat(inputFieldBtn_Main_0.value);
                if (!isNaN(val)) vmi.number("rotation").value = val;
                const rangeControl = inputFieldBtn_Main_0.closest(".range-control");
                if (rangeControl) {
                    rangeControl.querySelector("output").value = inputFieldBtn_Main_0.value;
                    const minimum = Number(inputFieldBtn_Main_0.min);
                    const maximum = Number(inputFieldBtn_Main_0.max);
                    const progress = maximum === minimum ? 0 : (inputFieldBtn_Main_0.value - minimum) / (maximum - minimum) * 100;
                    rangeControl.style.setProperty("--slider-progress", `${progress}%`);
                }
      });
      // Set initial value if present
      let initVal = parseFloat(inputFieldBtn_Main_0.value);
      if (!isNaN(initVal)) vmi.number("rotation").value = initVal;
    }
  },
});

document.querySelectorAll('canvas').forEach(canvas => {
  if (!canvas.hasAttribute("data-auto-w")) canvas.style.width = canvas.width + "px";
  if (!canvas.hasAttribute("data-auto-h")) canvas.style.height = canvas.height + "px";
});
</script>

    </div>
</body>
</html>
