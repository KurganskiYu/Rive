<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuri's Rive Animations</title>
    <script src="https://unpkg.com/@rive-app/webgl2@2.39.2"></script>
    <!-- Add Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../RiveIcon2.svg" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="animation-wrapper">

    <div style="position:fixed; top:10px; left:10px; z-index:9999; display:flex; flex-direction:column; align-items:center;">
        <canvas id="bg_button_canvas" width="80" height="80"></canvas>
    </div>
    <script>
      (function() {
        function updatePageBg(mode) {
            const body = document.body;
            const label = document.getElementById("bg_debug_label");
            if (label) label.textContent = "bg: " + mode;
            console.log("[BG] updatePageBg called with mode:", mode);
            if (mode === 1) {
                // Checkered pattern
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage =
                    "repeating-conic-gradient(#0f0f0f 0% 25%, transparent 0% 50%)";
                body.style.backgroundSize = "20px 20px";
                body.style.backgroundPosition = "";
            } else if (mode === 2) {
                // Solid black
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            } else if (mode === 3) {
                // Solid dark gray
                body.style.backgroundColor = "#121212";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            }
        }

        // Apply stored background immediately (before Rive loads)
        let storedBg = localStorage.getItem("page_bg_mode");
        if (storedBg) {
            updatePageBg(parseInt(storedBg));
        }

        const bgRive = new rive.Rive({
          src: "../bg_button.riv",
          canvas: document.getElementById("bg_button_canvas"),
          autoplay: true,
          artboard: "main",
          autoBind: true,
          stateMachines: "State Machine 1",
          onLoad: () => {
            bgRive.resizeDrawingSurfaceToCanvas();
            console.log("[BG] Rive loaded");
            const vmi = bgRive.viewModelInstance;
            console.log("[BG] viewModelInstance:", vmi);
            if (vmi) {
                const bgNum = vmi.number("bgNum");
                console.log("[BG] bgNum property:", bgNum);
                if (bgNum) {
                    // Initialize based on current stored state or default
                    let storedBg = localStorage.getItem("page_bg_mode");
                    let mode = storedBg ? parseInt(storedBg) : 1;
                    bgNum.value = mode;
                    updatePageBg(mode);
                    console.log("[BG] Initial mode set to:", mode, "bgNum.value:", bgNum.value);

                    // Listen for changes from Rive
                    bgNum.onValueChanged = (val) => {
                        console.log("[BG] onValueChanged fired:", val);
                        updatePageBg(val);
                        localStorage.setItem("page_bg_mode", String(val));
                    };

                    // Polling fallback: check bgNum.value periodically
                    let lastVal = bgNum.value;
                    setInterval(() => {
                        const cur = bgNum.value;
                        if (cur !== lastVal) {
                            console.log("[BG] poll detected change:", lastVal, "->", cur);
                            lastVal = cur;
                            updatePageBg(cur);
                            localStorage.setItem("page_bg_mode", String(cur));
                        }
                    }, 200);
                }
            }
          } }); 
      })();
    </script>
    
    <div class="animation-row" style="display: flex; gap: 32px; align-items: flex-start;">
      
      <div class="animation-container detail-animation">
        <canvas id="main_canvas" width="360" height="800"></canvas>
        <div class="description">
          <div style="display:flex;align-items:center;width:100%;">
            <div><span style="white-space: nowrap;"><a href="../riv/55_recoveryreport_v4.riv" target="_blank" style="color: white;">55 recoveryreport</a><span class="riv-file-size">&nbsp&nbsp;96 KB</span></span></div>
            
          </div>
          Size: 360px × 800px<br>State Machine: State Machine 1<br>Artboard: main<br>Note: Scripting<br>Input: v_num:state(2:0-3)<br>Input: v_bol:plusGreat(True)<br>Input: v_bol:plusGood(True)<br>Input: v_bol:plusBad(True)<br>
          <div class="controls-column" style="margin-top:8px;">
        <div class="range-control" style="width:100%;--slider-progress:66.6667%;">
            <output for="btn_main_input0">2</output>
            <span class="range-ticks" aria-hidden="true"><span style="left:33.33333333%;"></span><span style="left:66.66666667%;"></span></span>
            <input type="range" id="btn_main_input0" value="2" min="0" max="3" step="1" aria-label="state" />
            <span class="range-hint" aria-hidden="true">state</span>
            <span class="range-bound range-min">0</span>
            <span class="range-bound range-max">3</span>
        </div>
        
        <div style="display:flex;align-items:center;gap:4px;">
            <label for="btn_main_input1">plusGreat:</label>
            <input type="checkbox" id="btn_main_input1" checked />
        </div>
        
        <div style="display:flex;align-items:center;gap:4px;">
            <label for="btn_main_input2">plusGood:</label>
            <input type="checkbox" id="btn_main_input2" checked />
        </div>
        
        <div style="display:flex;align-items:center;gap:4px;">
            <label for="btn_main_input3">plusBad:</label>
            <input type="checkbox" id="btn_main_input3" checked />
        </div>
        </div>
        </div>
      </div>

      
      <div class="animation-container detail-animation">
        <canvas id="preview_canvas" width="360" height="800"></canvas>
        <div class="description">
          <div style="display:flex;align-items:center;width:100%;">
            <div>Preview:</div>
            
          </div>
          
          <div class="controls-column" style="margin-top:8px;">
        <div class="range-control" style="width:100%;--slider-progress:66.6667%;">
            <output for="btn_preview_input0">2</output>
            <span class="range-ticks" aria-hidden="true"><span style="left:33.33333333%;"></span><span style="left:66.66666667%;"></span></span>
            <input type="range" id="btn_preview_input0" value="2" min="0" max="3" step="1" aria-label="state" />
            <span class="range-hint" aria-hidden="true">state</span>
            <span class="range-bound range-min">0</span>
            <span class="range-bound range-max">3</span>
        </div>
        
        <div style="display:flex;align-items:center;gap:4px;">
            <label for="btn_preview_input1">plusGreat:</label>
            <input type="checkbox" id="btn_preview_input1" checked />
        </div>
        
        <div style="display:flex;align-items:center;gap:4px;">
            <label for="btn_preview_input2">plusGood:</label>
            <input type="checkbox" id="btn_preview_input2" checked />
        </div>
        
        <div style="display:flex;align-items:center;gap:4px;">
            <label for="btn_preview_input3">plusBad:</label>
            <input type="checkbox" id="btn_preview_input3" checked />
        </div>
        </div>
        </div>
      </div>

    </div>
<script>

const mainRive = new rive.Rive({
  src: "../riv/55_recoveryreport_v4.riv",
  canvas: document.getElementById("main_canvas"),
  autoplay: true,autoBind: true, artboard: "main", stateMachines: "State Machine 1",
  

  onLoad: () => {
    mainRive.resizeDrawingSurfaceToCanvas();
    const vmi = mainRive.viewModelInstance;
    let inputFieldBtn_Main_0 = document.getElementById("btn_main_input0");
    if (inputFieldBtn_Main_0 && vmi) {
      // Update numeric ViewModel variable
      inputFieldBtn_Main_0.addEventListener("input", () => {
        let val = parseFloat(inputFieldBtn_Main_0.value);
                if (!isNaN(val)) vmi.number("state").value = val;
                const rangeControl = inputFieldBtn_Main_0.closest(".range-control");
                if (rangeControl) {
                    rangeControl.querySelector("output").value = inputFieldBtn_Main_0.value;
                    const minimum = Number(inputFieldBtn_Main_0.min);
                    const maximum = Number(inputFieldBtn_Main_0.max);
                    const progress = maximum === minimum ? 0 : (inputFieldBtn_Main_0.value - minimum) / (maximum - minimum) * 100;
                    rangeControl.style.setProperty("--slider-progress", `${progress}%`);
                }
      });
      // Set initial value if present
      let initVal = parseFloat(inputFieldBtn_Main_0.value);
      if (!isNaN(initVal)) vmi.number("state").value = initVal;
    }
    let inputFieldBtn_Main_1 = document.getElementById("btn_main_input1");
    if (inputFieldBtn_Main_1 && vmi) {
      // Update boolean ViewModel variable
      inputFieldBtn_Main_1.addEventListener("change", () => {
        vmi.boolean("plusGreat").value = inputFieldBtn_Main_1.checked;
      });
      // Set initial value
      vmi.boolean("plusGreat").value = inputFieldBtn_Main_1.checked;
    }
    let inputFieldBtn_Main_2 = document.getElementById("btn_main_input2");
    if (inputFieldBtn_Main_2 && vmi) {
      // Update boolean ViewModel variable
      inputFieldBtn_Main_2.addEventListener("change", () => {
        vmi.boolean("plusGood").value = inputFieldBtn_Main_2.checked;
      });
      // Set initial value
      vmi.boolean("plusGood").value = inputFieldBtn_Main_2.checked;
    }
    let inputFieldBtn_Main_3 = document.getElementById("btn_main_input3");
    if (inputFieldBtn_Main_3 && vmi) {
      // Update boolean ViewModel variable
      inputFieldBtn_Main_3.addEventListener("change", () => {
        vmi.boolean("plusBad").value = inputFieldBtn_Main_3.checked;
      });
      // Set initial value
      vmi.boolean("plusBad").value = inputFieldBtn_Main_3.checked;
    }
  },
});

const previewRive = new rive.Rive({
  src: "../riv/55_recoveryreport_v4.riv",
  canvas: document.getElementById("preview_canvas"),
  autoplay: true, autoBind: true, artboard: "preview", stateMachines: "State Machine 1",
  

  onLoad: () => {

    if (inputFieldBtn_Preview_0 && vmi) {
      // Update numeric ViewModel variable
      inputFieldBtn_Preview_0.addEventListener("input", () => {
        let val = parseFloat(inputFieldBtn_Preview_0.value);
                if (!isNaN(val)) vmi.number("state").value = val;
                const rangeControl = inputFieldBtn_Preview_0.closest(".range-control");
                if (rangeControl) {
                    rangeControl.querySelector("output").value = inputFieldBtn_Preview_0.value;
                    const minimum = Number(inputFieldBtn_Preview_0.min);
                    const maximum = Number(inputFieldBtn_Preview_0.max);
                    const progress = maximum === minimum ? 0 : (inputFieldBtn_Preview_0.value - minimum) / (maximum - minimum) * 100;
                    rangeControl.style.setProperty("--slider-progress", `${progress}%`);
                }
      });
      // Set initial value if present
      let initVal = parseFloat(inputFieldBtn_Preview_0.value);
      if (!isNaN(initVal)) vmi.number("state").value = initVal;
    }
    let inputFieldBtn_Preview_1 = document.getElementById("btn_preview_input1");
    if (inputFieldBtn_Preview_1 && vmi) {
      // Update boolean ViewModel variable
      inputFieldBtn_Preview_1.addEventListener("change", () => {
        vmi.boolean("plusGreat").value = inputFieldBtn_Preview_1.checked;
      });
      // Set initial value
      vmi.boolean("plusGreat").value = inputFieldBtn_Preview_1.checked;
    }
    let inputFieldBtn_Preview_2 = document.getElementById("btn_preview_input2");
    if (inputFieldBtn_Preview_2 && vmi) {
      // Update boolean ViewModel variable
      inputFieldBtn_Preview_2.addEventListener("change", () => {
        vmi.boolean("plusGood").value = inputFieldBtn_Preview_2.checked;
      });
      // Set initial value
      vmi.boolean("plusGood").value = inputFieldBtn_Preview_2.checked;
    }
    let inputFieldBtn_Preview_3 = document.getElementById("btn_preview_input3");
    if (inputFieldBtn_Preview_3 && vmi) {
      // Update boolean ViewModel variable
      inputFieldBtn_Preview_3.addEventListener("change", () => {
        vmi.boolean("plusBad").value = inputFieldBtn_Preview_3.checked;
      });
      // Set initial value
      vmi.boolean("plusBad").value = inputFieldBtn_Preview_3.checked;
    }
  },
});

document.querySelectorAll('canvas').forEach(canvas => {
  if (!canvas.hasAttribute("data-auto-w")) canvas.style.width = canvas.width + "px";
  if (!canvas.hasAttribute("data-auto-h")) canvas.style.height = canvas.height + "px";
});
</script>

    </div>
</body>
</html>
