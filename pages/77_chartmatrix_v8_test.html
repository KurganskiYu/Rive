    <script>
      (function() {
        function updatePageBg(mode) {
            const body = document.body;
            const label = document.getElementById("bg_debug_label");
            if (label) label.textContent = "bg: " + mode;
            console.log("[BG] updatePageBg called with mode:", mode);
            if (mode === 1) {
                // Checkered pattern
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage =
                    "repeating-conic-gradient(#0f0f0f 0% 25%, transparent 0% 50%)";
                body.style.backgroundSize = "20px 20px";
                body.style.backgroundPosition = "";
            } else if (mode === 2) {
                // Solid black
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            } else if (mode === 3) {
                // Solid dark gray
                body.style.backgroundColor = "#121212";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            }
        }

        // Apply stored background immediately (before Rive loads)
        let storedBg = localStorage.getItem("page_bg_mode");
        if (storedBg) {
            updatePageBg(parseInt(storedBg));
        }

        const bgRive = new rive.Rive({
          src: "../bg_button.riv",
          canvas: document.getElementById("bg_button_canvas"),
          autoplay: true,
          artboard: "main",
          autoBind: true,
          stateMachines: "State Machine 1",
          onLoad: () => {
            bgRive.resizeDrawingSurfaceToCanvas();
            console.log("[BG] Rive loaded");
            const vmi = bgRive.viewModelInstance;
            console.log("[BG] viewModelInstance:", vmi);
            if (vmi) {
                const bgNum = vmi.number("bgNum");
                console.log("[BG] bgNum property:", bgNum);
                if (bgNum) {
                    // Initialize based on current stored state or default
                    let storedBg = localStorage.getItem("page_bg_mode");
                    let mode = storedBg ? parseInt(storedBg) : 1;
                    bgNum.value = mode;
                    updatePageBg(mode);
                    console.log("[BG] Initial mode set to:", mode, "bgNum.value:", bgNum.value);

                    // Listen for changes from Rive
                    bgNum.onValueChanged = (val) => {
                        console.log("[BG] onValueChanged fired:", val);
                        updatePageBg(val);
                        localStorage.setItem("page_bg_mode", String(val));
                    };

                    // Polling fallback: check bgNum.value periodically
                    let lastVal = bgNum.value;
                    setInterval(() => {
                        const cur = bgNum.value;
                        if (cur !== lastVal) {
                            console.log("[BG] poll detected change:", lastVal, "->", cur);
                            lastVal = cur;
                            updatePageBg(cur);
                            localStorage.setItem("page_bg_mode", String(cur));
                        }
                    }, 200);
                }
            }
          } }); 
      })();
    </script>

<script>

// Rows list (MainVM.rows -> RowVM { name, values, tap }), driven from one shared model
// and mirrored into every Rive instance that has the list.
const rowsPanel = (() => {
  const MAX_STATE = 2;
  const model = [];
  const targets = [];
  const columns = 7;

  const el = (id) => document.getElementById(id);
  const listEl = el("rows_list");
  const countInput = el("rows_count");
  const indicator = el("tap_indicator");
  const statusEl = el("rows_status");

  const clampState = (n) => (Number.isFinite(n) ? Math.min(MAX_STATE, Math.max(0, Math.round(n))) : 0);
  const valuesString = (row) => row.values.join(" ");

  function parseValues(text) {
    return text.trim() === "" ? [] : text.trim().split(/\s+/).map((t) => clampState(Number(t)));
  }

  function makeRow(index) {
    const seeds = ["1 1 2 1 2 1 1", "2 1 1 2 1 1 2", "1 2 1 1 2 1 1"];
    const values = index < seeds.length ? parseValues(seeds[index]) : [];
    while (values.length < columns) values.push(1);
    values.length = columns;
    return { name: "Row" + (index + 1), values };
  }

  function pushRow(target, row) {
    if (!target.list || !target.rowVM) return;
    const vmi = target.rowVM.instance();
    const nameProp = vmi.string("name");
    const valuesProp = vmi.string("values");
    if (nameProp) nameProp.value = row.name;
    if (valuesProp) valuesProp.value = valuesString(row);
    target.list.addInstance(vmi);

    // The closure captures the row object, so the index is resolved at tap time.
    const handler = () => onTap(row, target.label);
    const trig = vmi.trigger("tap");
    if (trig) trig.on(handler);
    target.entries.set(row, { vmi, trig, handler });
  }

  function dropRow(target, row) {
    const entry = target.entries.get(row);
    if (!entry) return;
    if (entry.trig) entry.trig.off(entry.handler);
    target.list.removeInstance(entry.vmi);
    target.entries.delete(row);
  }

  function pushValues(row) {
    targets.forEach((t) => {
      const entry = t.entries.get(row);
      const prop = entry && entry.vmi.string("values");
      if (prop) prop.value = valuesString(row);
    });
  }

  function pushName(row) {
    targets.forEach((t) => {
      const entry = t.entries.get(row);
      const prop = entry && entry.vmi.string("name");
      if (prop) prop.value = row.name;
    });
  }

  function renderCells(row, cellsEl) {
    cellsEl.textContent = "";
    row.values.forEach((state, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "row-cell";
      b.dataset.state = state;
      b.textContent = state;
      b.title = "Click to cycle 0 → 1 → 2";
      b.addEventListener("click", () => {
        row.values[i] = (row.values[i] + 1) % (MAX_STATE + 1);
        b.dataset.state = row.values[i];
        b.textContent = row.values[i];
        row.valuesInput.value = valuesString(row);
        pushValues(row);
      });
      cellsEl.appendChild(b);
    });
  }

  function buildEditor(row) {
    const wrap = document.createElement("div");
    wrap.className = "row-editor";

    const idx = document.createElement("span");
    idx.className = "row-index";

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "row-name";
    nameInput.value = row.name;
    nameInput.addEventListener("input", () => {
      row.name = nameInput.value;
      pushName(row);
    });

    const valuesInput = document.createElement("input");
    valuesInput.type = "text";
    valuesInput.className = "row-values";
    valuesInput.value = valuesString(row);
    valuesInput.addEventListener("input", () => {
      row.values = parseValues(valuesInput.value);
      renderCells(row, cells);
      pushValues(row);
    });

    const cells = document.createElement("div");
    cells.className = "row-cells";
    renderCells(row, cells);

    wrap.append(idx, nameInput, valuesInput, cells);
    row.editor = wrap;
    row.indexEl = idx;
    row.valuesInput = valuesInput;
    row.cellsEl = cells;
    listEl.appendChild(wrap);
  }

  function refreshIndexes() {
    model.forEach((row, i) => (row.indexEl.textContent = "#" + (i + 1)));
    countInput.value = model.length;
  }

  function addRow() {
    const row = makeRow(model.length);
    model.push(row);
    buildEditor(row);
    targets.forEach((t) => pushRow(t, row));
    refreshIndexes();
    updateStatus();
  }

  function removeRow() {
    const row = model.pop();
    if (!row) return;
    targets.forEach((t) => dropRow(t, row));
    row.editor.remove();
    refreshIndexes();
    updateStatus();
  }

  function setRowCount(n) {
    n = Math.max(0, Math.min(50, Math.floor(n)));
    while (model.length < n) addRow();
    while (model.length > n) removeRow();
  }

  function onTap(row) {
    const i = model.indexOf(row);
    if (i < 0) return;
    indicator.textContent = `Row ${i + 1} tapped`;
    indicator.style.color = "#fff";
    indicator.animate(
      [
        { background: "#2f7de1", opacity: 1 },
        { background: "transparent", opacity: 0.25 },
        { background: "#2f7de1", opacity: 1 },
        { background: "transparent", opacity: 1 },
      ],
      { duration: 500, easing: "ease-out" }
    );
    row.editor.animate(
      [{ background: "#2f7de1" }, { background: "transparent" }],
      { duration: 600, easing: "ease-out" }
    );
  }

  function updateStatus() {
    statusEl.textContent = targets.length
      ? "Bound: " + targets.map((t) => `${t.label} (${t.list.length} rows in Rive)`).join(", ")
      : "No animation with a 'rows' list is bound yet.";
  }

  // Call from each Rive instance's onLoad.
  function attach(label, riveInstance) {
    const vmi = riveInstance.viewModelInstance;
    const list = vmi && vmi.list("rows");
    const rowVM = riveInstance.viewModelByName("RowVM");
    if (!list || !rowVM) {
      console.warn(`[rows] "${label}": no 'rows' list or 'RowVM' found`);
      return;
    }
    // Replace the editor's default Row1–Row3 with the rows from the shared model.
    while (list.length > 0) list.removeInstanceAt(0);
    const target = { label, list, rowVM, entries: new Map() };
    targets.push(target);
    model.forEach((row) => pushRow(target, row));
    updateStatus();
  }

  countInput.addEventListener("change", () => setRowCount(Number(countInput.value)));

  setRowCount(3);
  return { attach };
})();

// Fit.Layout: the fixed axis keeps its CSS size, while an `auto` axis follows the size
// the Rive layout reports through bounds (in artboard units, hence the scale factor).
function autoSizeLayoutCanvas(riveInstance, canvas, autoW, autoH, scale) {
  const sync = (force) => {
    const b = riveInstance.bounds;
    let changed = false;
    if (autoW) {
      const w = (b.maxX - b.minX) * scale;
      if (w > 0 && Math.abs(w - (parseFloat(canvas.style.width) || 0)) > 0.5) {
        canvas.style.width = w + "px";
        changed = true;
      }
    }
    if (autoH) {
      const h = (b.maxY - b.minY) * scale;
      if (h > 0 && Math.abs(h - (parseFloat(canvas.style.height) || 0)) > 0.5) {
        canvas.style.height = h + "px";
        changed = true;
      }
    }
    if (changed || force === true) riveInstance.resizeDrawingSurfaceToCanvas();
    requestAnimationFrame(() => sync());
  };
  // Start from the artboard's own size so a non-hugging artboard keeps its designed size.
  riveInstance.resetArtboardSize();
  sync(true);
  window.addEventListener("resize", () => riveInstance.resizeDrawingSurfaceToCanvas());
  window
    .matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
    .addEventListener("change", () => riveInstance.resizeDrawingSurfaceToCanvas());
}

const mainRive = new rive.Rive({
  src: "../riv/77_chartmatrix_v8.riv",
  canvas: document.getElementById("main_canvas"),
  autoplay: true,autoBind: true, artboard: "main", stateMachines: "State Machine 1",
  layout: new rive.Layout({ fit: rive.Fit.Layout, layoutScaleFactor: 1 }),

  onLoad: () => {
    autoSizeLayoutCanvas(mainRive, document.getElementById("main_canvas"), false, true, 1);
    rowsPanel.attach("main", mainRive);
    const vmi = mainRive.viewModelInstance;
    let inputFieldBtn_Main_0 = document.getElementById("btn_main_input0");
    if (inputFieldBtn_Main_0 && vmi) {
      // Update numeric ViewModel variable
      inputFieldBtn_Main_0.addEventListener("input", () => {
        let val = parseFloat(inputFieldBtn_Main_0.value);
                if (!isNaN(val)) vmi.number("rowHeight").value = val;
