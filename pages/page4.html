        body {
            font-family: 'Inter', sans-serif; /* Apply modern font */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 10vh;
            background-color: #000000;
            background-image: 
                repeating-conic-gradient(#0f0f0f 0% 25%, transparent 0% 50%);
            background-size: 20px 20px; /* Adjust size of the checkered pattern */
            padding: 10px 0;
        }
        .animation-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 30px;
            width: 95%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        canvas {
            border: 1px solid #292929; 
            width: auto; /* Ensure the CSS width matches the HTML width */
            height: auto; /* Ensure the CSS height matches the HTML height */
        }
        /* Fit.Layout canvases are measured via getBoundingClientRect, so use an outline
           instead of a border (a border would be added to the artboard size). */
        canvas.layout-canvas {
            border: none;
            outline: 1px solid #292929;
        }
        #bg_button_canvas {
            border: none !important;
        }
        .bg-btn {
            border: 0px;
        }
        .animation-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .description {
            color: rgb(80, 80, 80);
            font-size: 0.8rem;
            margin-top: 8px;
            line-height: 1.4;
        }
        .riv-file-size {
            font-family: 'Roboto Condensed', sans-serif;
            color: rgb(80, 80, 80);
            font-size: 0.85rem;
        }
        .animation-row {
          display: flex;
          gap: 32px;
          align-items: flex-start;
        }
        .controls-column {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            margin-left: auto;
            width: 100%;
        }
        .controls-column > div:not(.range-control) {
            width: 100%;
            justify-content: space-between;
        }
        .controls-column > * {
            width: max-content;
        }
        .controls-column label {
            max-width: 90px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .detail-animation {
            width: min-content;
        }
        .detail-animation .description {
            width: 0;
            min-width: 100%;
            overflow-wrap: anywhere;
        }
        .detail-animation .controls-column label {
            flex: 1;
            min-width: 0;
            max-width: none;
        }
        .detail-animation .controls-column > div:not(.range-control) > input:not([type="checkbox"]):not([type="color"]),
        .detail-animation .controls-column select {
            box-sizing: border-box;
            flex: 0 0 50%;
            min-width: 0;
        }
        .rive-btn {
            background: #222222;
            color: rgb(200, 200, 200);
            border: 0.5px solid #464646;
            border-radius: 0px;
            padding: 4px 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            margin-left: 0; /* Remove left margin for perfect right alignment */
        }
        input[type="number"] {
            border-radius: 8px;
            background: #8a8a8a;
            border: 1px solid #8a8a8a;
            padding: 4px 4px;
            font-size: 1rem;
            outline: none;
        }
        .range-control {
            position: relative;
            padding: 14px 0 0;
        }
        .range-control::before,
        .range-control::after {
            position: absolute;
            top: 18px;
            width: 2px;
            height: 8px;
            z-index: 0;
            background: rgb(120, 120, 120);
            content: "";
        }
        .range-control::before {
            left: 0;
        }
        .range-control::after {
            right: 0;
        }
        .range-control output {
            position: absolute;
            top: 0;
            left: var(--slider-progress);
            transform: translateX(-50%);
            color: rgb(255, 255, 255);
            font-size: 10px;
            line-height: 1.5;
            z-index: 3;
        }
        .range-control .range-ticks {
            position: absolute;
            top: 20px;
            right: 6px;
            left: 6px;
            z-index: 0;
            height: 2px;
        }
        .range-control .range-ticks > span {
            position: absolute;
            width: 1px;
            height: 100%;
            transform: translateX(-50%);
            background: rgb(120, 120, 120);
        }
        .range-control .range-bound {
            position: absolute;
            top: 2px;
            color: rgb(80, 80, 80);
            font-size: 10px;
            line-height: 1;
        }
        .range-control .range-min {
            left: 1px;
            transform: translateX(-50%);
        }
        .range-control .range-max {
            right: 1px;
            transform: translateX(50%);
        }
        .range-control input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 16px;
            margin: 0;
            cursor: pointer;
            background: transparent;
        }
        .range-control input[type="range"]::-webkit-slider-runnable-track {
            height: 0.5px;
            background: rgb(80, 80, 80);
        }
        .range-control input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            margin-top: -5px;
            border: 1px solid rgb(214, 214, 214);
            border-radius: 0px;
            background: rgb(22, 22, 22);
            z-index: 2;
        }
        .range-control input[type="range"]::-moz-range-track {
            height: 0.5px;
            background: rgb(90, 90, 90);
        }
        .range-control input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border: 1px solid rgb(120, 120, 120);
            border-radius: 50%;
            background: white;

        input[type="text"] {

        }
        input[type="checkbox"] {

            border-radius: 0px;
            background: #8a8a8a00;
            border: 0.5px solid #8a8a8a;
            outline: none;
            accent-color: #646464;
            appearance: none; /* Remove default checkbox style */
            -webkit-appearance: none;
            display: inline-block;
            /*vertical-align: middle; */
            position: relative;
            cursor: pointer;
            margin-right: 0;
        }
        input[type="checkbox"]:checked::after {
            content: "";

            position: absolute;
            left: 5px;
            top: 1px;
            width: 5px;
            height: 9px;
            border: solid #8a8a8a;
            border-width: 0 2px 2px 0;

        input[type="color"] {
            border-radius: 0px;
            background: #000000;
            border: none;
            width: 16px;
            height: 16px;
            padding: 0;
            outline: none;
            cursor: pointer;

            -webkit-appearance: none;
            appearance: none;
            /* Optional: add a subtle box-shadow for focus */
            box-shadow: 0 0 0 0px #646464 inset;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
            border-radius: 0px;
        }
        input[type="color"]::-webkit-color-swatch {
            border-radius: 0px;
            border: none;
        }
        input[type="color"]:focus {
            box-shadow: 0 0 0 2px #464646;
        }

    <div style="position:fixed; top:10px; right:10px; z-index:9999; display:flex; flex-direction:column; align-items:center;">

    <script>
      (function() {
        function updatePageBg(mode) {
            const body = document.body;
            const label = document.getElementById("bg_debug_label");
            if (label) label.textContent = "bg: " + mode;
            console.log("[BG] updatePageBg called with mode:", mode);
            if (mode === 1) {
                // Checkered pattern
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage =
                    "repeating-conic-gradient(#0f0f0f 0% 25%, transparent 0% 50%)";
                body.style.backgroundSize = "20px 20px";
                body.style.backgroundPosition = "";
            } else if (mode === 2) {
                // Solid black
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            } else if (mode === 3) {
                // Solid dark gray
                body.style.backgroundColor = "#121212";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            }
        }

        // Apply stored background immediately (before Rive loads)
        let storedBg = localStorage.getItem("page_bg_mode");
        if (storedBg) {
            updatePageBg(parseInt(storedBg));
        }

        const bgRive = new rive.Rive({
          src: "../bg_button.riv",
          canvas: document.getElementById("bg_button_canvas"),
          autoplay: true,
          artboard: "main",
          autoBind: true,
          stateMachines: "State Machine 1",
          onLoad: () => {
            bgRive.resizeDrawingSurfaceToCanvas();
            console.log("[BG] Rive loaded");
            const vmi = bgRive.viewModelInstance;
            console.log("[BG] viewModelInstance:", vmi);
            if (vmi) {
                const bgNum = vmi.number("bgNum");
                console.log("[BG] bgNum property:", bgNum);
                if (bgNum) {
                    // Initialize based on current stored state or default
                    let storedBg = localStorage.getItem("page_bg_mode");
                    let mode = storedBg ? parseInt(storedBg) : 1;
                    bgNum.value = mode;
                    updatePageBg(mode);
                    console.log("[BG] Initial mode set to:", mode, "bgNum.value:", bgNum.value);

                    // Listen for changes from Rive
                    bgNum.onValueChanged = (val) => {
                        console.log("[BG] onValueChanged fired:", val);
                        updatePageBg(val);
                        localStorage.setItem("page_bg_mode", String(val));
                    };

                    // Polling fallback: check bgNum.value periodically
                    let lastVal = bgNum.value;
                    setInterval(() => {
                        const cur = bgNum.value;
                        if (cur !== lastVal) {
                            console.log("[BG] poll detected change:", lastVal, "->", cur);
                            lastVal = cur;
                            updatePageBg(cur);
                            localStorage.setItem("page_bg_mode", String(cur));
                        }
                    }, 200);
                }
            }
          } }); 
      })();
    </script>
