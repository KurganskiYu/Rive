            background-size: 20px 20px; /* Adjust size of the checkered pattern */
            padding: 10px 0;
        }
        .animation-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 30px;
            width: 95%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        canvas {
            border: 1px solid #292929; 
            width: auto; /* Ensure the CSS width matches the HTML width */
            height: auto; /* Ensure the CSS height matches the HTML height */
        }
        /* Fit.Layout canvases are measured via getBoundingClientRect, so use an outline
           instead of a border (a border would be added to the artboard size). */
        canvas.layout-canvas {
            border: none;
            outline: 1px solid #292929;
        }
        #bg_button_canvas {
            border: none !important;
        }
        .bg-btn {
            border: 0px;
        }
        .animation-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .description {
            color: rgb(80, 80, 80);
            font-size: 0.8rem;
            margin-top: 8px;
            line-height: 1.4;
        }
        .animation-row {
          display: flex;
          gap: 32px;
          align-items: flex-start;
        }
        .controls-column {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            margin-left: auto;
            width: 100%;
        }
        .controls-column > div:not(.range-control) {
            width: 100%;
            justify-content: space-between;
        }
        .controls-column > * {
            width: max-content;
        }
        .controls-column label {
            max-width: 90px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .detail-animation {
            width: min-content;
        }
        .detail-animation .description {
            width: 0;
            min-width: 100%;

        }
        .detail-animation .controls-column label {
            flex: 1;
            min-width: 0;
            max-width: none;

            box-sizing: border-box;
            flex: 0 0 50%;
            min-width: 0;
        }
        .rive-btn {
            background: #64646400;
            color: white;

            border-radius: 0px;
            padding: 6px 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;

        input[type="number"] {
            border-radius: 8px;
            background: #8a8a8a;
            border: 1px solid #8a8a8a;
            padding: 4px 4px;
            font-size: 1rem;
            outline: none;
        }
        .range-control {
            position: relative;
            padding: 14px 0 0;
        }
        .range-control::before,
        .range-control::after {
            position: absolute;
            top: 18px;
            width: 2px;
            height: 8px;
            z-index: 2;
            background: rgb(120, 120, 120);
            content: "";
        }
        .range-control::before {
            left: 0;
        }
        .range-control::after {
            right: 0;
        }
        .range-control output {
            position: absolute;
            top: 0;
            left: var(--slider-progress);
            transform: translateX(-50%);
            color: rgb(255, 255, 255);
            font-size: 10px;
            line-height: 1.5;
            z-index: 3;
        }
        .range-control .range-ticks {
            position: absolute;
            top: 20px;
            right: 4px;
            left: 4px;
            z-index: 0;
            height: 2px;
            background: repeating-linear-gradient(to right, transparent 0, transparent 17px, rgb(120, 120, 120) 17px, rgb(120, 120, 120) 18px);
        }
        .range-control .range-bound {
            position: absolute;
            top: 2px;
            color: rgb(80, 80, 80);
            font-size: 10px;
            line-height: 1;
        }
        .range-control .range-min {
            left: 1px;
            transform: translateX(-50%);
        }
        .range-control .range-max {
            right: 1px;
            transform: translateX(50%);
        }
        .range-control input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 16px;
            margin: 0;
            cursor: pointer;
            background: transparent;
        }
        .range-control input[type="range"]::-webkit-slider-runnable-track {
            height: 0.5px;
            background: rgb(80, 80, 80);
        }
        .range-control input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            margin-top: -5px;
            border: 1px solid rgb(214, 214, 214);
            border-radius: 6px;
            background: rgb(60, 60, 60);
        }
        .range-control input[type="range"]::-moz-range-track {
            height: 0.5px;
            background: rgb(90, 90, 90);
        }
        .range-control input[type="range"]::-moz-range-thumb {

            height: 10px;

            border-radius: 0px;
            border: none;

            box-shadow: 0 0 0 2px #464646;

    <script>
      (function() {
        function updatePageBg(mode) {
            const body = document.body;
            const label = document.getElementById("bg_debug_label");
            if (label) label.textContent = "bg: " + mode;
            console.log("[BG] updatePageBg called with mode:", mode);
            if (mode === 1) {
                // Checkered pattern
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage =
                    "repeating-conic-gradient(#0f0f0f 0% 25%, transparent 0% 50%)";
                body.style.backgroundSize = "20px 20px";
                body.style.backgroundPosition = "";
            } else if (mode === 2) {
                // Solid black
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            } else if (mode === 3) {
                // Solid dark gray
                body.style.backgroundColor = "#121212";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            }
        }

        // Apply stored background immediately (before Rive loads)
        let storedBg = localStorage.getItem("page_bg_mode");
        if (storedBg) {
            updatePageBg(parseInt(storedBg));
        }

        const bgRive = new rive.Rive({
          src: "../bg_button.riv",
          canvas: document.getElementById("bg_button_canvas"),
          autoplay: true,
          artboard: "main",
          autoBind: true,
          stateMachines: "State Machine 1",
          onLoad: () => {
            bgRive.resizeDrawingSurfaceToCanvas();
            console.log("[BG] Rive loaded");
            const vmi = bgRive.viewModelInstance;
            console.log("[BG] viewModelInstance:", vmi);
            if (vmi) {
                const bgNum = vmi.number("bgNum");
                console.log("[BG] bgNum property:", bgNum);
                if (bgNum) {
                    // Initialize based on current stored state or default
                    let storedBg = localStorage.getItem("page_bg_mode");
                    let mode = storedBg ? parseInt(storedBg) : 1;
                    bgNum.value = mode;
                    updatePageBg(mode);
                    console.log("[BG] Initial mode set to:", mode, "bgNum.value:", bgNum.value);

                    // Listen for changes from Rive
                    bgNum.onValueChanged = (val) => {
                        console.log("[BG] onValueChanged fired:", val);
                        updatePageBg(val);
                        localStorage.setItem("page_bg_mode", String(val));
                    };

                    // Polling fallback: check bgNum.value periodically
                    let lastVal = bgNum.value;
                    setInterval(() => {
                        const cur = bgNum.value;
                        if (cur !== lastVal) {
                            console.log("[BG] poll detected change:", lastVal, "->", cur);
                            lastVal = cur;
                            updatePageBg(cur);
                            localStorage.setItem("page_bg_mode", String(cur));
                        }
                    }, 200);
                }
            }
          } }); 
      })();
    </script>
