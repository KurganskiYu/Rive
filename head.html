<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuri's Rive Animations</title>
    <script src="https://unpkg.com/@rive-app/webgl2"></script>
    <!-- Add Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="RiveIcon2.svg" />
    <style>
        body {
            font-family: 'Roboto', sans-serif; /* Apply modern font */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 10vh;
            background-color: #000000;
            background-image: 
                repeating-conic-gradient(#0f0f0f 0% 25%, transparent 0% 50%);
            background-size: 20px 20px; /* Adjust size of the checkered pattern */
            padding: 10px 0;
        }
        .animation-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 30px;
            width: 95%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        canvas {
            border: 1px solid #292929; 
            width: auto; /* Ensure the CSS width matches the HTML width */
            height: auto; /* Ensure the CSS height matches the HTML height */
        }
        #bg_button_canvas {
            border: none !important;
        }
        .bg-btn {
            border: 0px;
        }
        .animation-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .description {
            color: rgb(120, 120, 120);
            font-size: 0.9rem;
            margin-top: 8px;
            line-height: 1.4;
        }
        .animation-row {
          display: flex;
          gap: 32px;
          align-items: flex-start;
        }
        .controls-column {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            gap: 8px;
            margin-left: auto;
        }
        .controls-column > * {
            width: max-content;
        }
        .rive-btn {
            background: #646464;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 8px;
            cursor: pointer;
            margin-left: 0; /* Remove left margin for perfect right alignment */
        }
        input[type="number"] {
            border-radius: 8px;
            background: #8a8a8a;
            border: 1px solid #8a8a8a;
            padding: 4px 4px;
            font-size: 1rem;
            outline: none;
        }
        .range-control {
            position: relative;
            padding: 14px 0 13px;
        }
        .range-control::before,
        .range-control::after {
            position: absolute;
            top: 19px;
            width: 1px;
            height: 6px;
            background: rgb(120, 120, 120);
            content: "";
        }
        .range-control::before {
            left: 0;
        }
        .range-control::after {
            right: 0;
        }
        .range-control output {
            position: absolute;
            top: 0;
            left: var(--slider-progress);
            transform: translateX(-50%);
            color: rgb(120, 120, 120);
            font-size: 10px;
            line-height: 1;
        }
        .range-control .range-ticks {
            position: absolute;
            top: 20px;
            right: 1px;
            left: 1px;
            z-index: 0;
            height: 3px;
            background: repeating-linear-gradient(to right, transparent 0, transparent 17px, rgb(120, 120, 120) 17px, rgb(120, 120, 120) 18px);
        }
        .range-control .range-bound {
            position: absolute;
            top: 33px;
            color: rgb(120, 120, 120);
            font-size: 10px;
            line-height: 1;
        }
        .range-control .range-min {
            left: 0;
        }
        .range-control .range-max {
            right: 0;
        }
        .range-control input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 16px;
            margin: 0;
            cursor: pointer;
            background: transparent;
        }
        .range-control input[type="range"]::-webkit-slider-runnable-track {
            height: 1px;
            background: rgb(120, 120, 120);
        }
        .range-control input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            margin-top: -5px;
            border: 1px solid rgb(120, 120, 120);
            border-radius: 50%;
            background: white;
        }
        .range-control input[type="range"]::-moz-range-track {
            height: 1px;
            background: rgb(120, 120, 120);
        }
        .range-control input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border: 1px solid rgb(120, 120, 120);
            border-radius: 50%;
            background: white;
        }
        input[type="text"] {
            border-radius: 8px;
            background: #8a8a8a;
            border: 1px solid #8a8a8a;
            padding: 4px 4px;
            font-size: 1rem;
            outline: none;
        }
        input[type="checkbox"] {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            background: #8a8a8a;
            border: none;
            outline: none;
            accent-color: #646464;
            appearance: none; /* Remove default checkbox style */
            -webkit-appearance: none;
            display: inline-block;
            /*vertical-align: middle; */
            position: relative;
            cursor: pointer;
        }
        input[type="checkbox"]:checked::after {
            content: "";
            display: block;
            position: absolute;
            left: 6px;
            top: 1px;
            width: 8px;
            height: 14px;
            border: solid #000000;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }
        input[type="color"] {
            border-radius: 8px;
            background: #000000;
            border: none;
            width: 24px;
            height: 24px;
            padding: 0;
            outline: none;
            cursor: pointer;
            /* Remove default appearance for consistency */
            -webkit-appearance: none;
            appearance: none;
            /* Optional: add a subtle box-shadow for focus */
            box-shadow: 0 0 0 0px #646464 inset;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
            border-radius: 8px;
        }
        input[type="color"]::-webkit-color-swatch {
            border-radius: 8px;
            border: none;
        }
        input[type="color"]:focus {
            box-shadow: 0 0 0 2px #464646;
        }
    </style>
  </head>
  <body>
    <div class="animation-wrapper">
