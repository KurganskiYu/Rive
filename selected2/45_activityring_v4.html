<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuri's Rive Animations</title>
    <script src="https://unpkg.com/@rive-app/webgl2@2.39.2"></script>
    <!-- Add Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="RiveIcon2.svg" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="animation-wrapper">

    <div style="position:fixed; top:10px; left:10px; z-index:9999; display:flex; flex-direction:column; align-items:center;">
        <canvas id="bg_button_canvas" width="80" height="80"></canvas>
    </div>
    <script>
      (function() {
        function updatePageBg(mode) {
            const body = document.body;
            const label = document.getElementById("bg_debug_label");
            if (label) label.textContent = "bg: " + mode;
            console.log("[BG] updatePageBg called with mode:", mode);
            if (mode === 1) {
                // Checkered pattern
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage =
                    "repeating-conic-gradient(#0f0f0f 0% 25%, transparent 0% 50%)";
                body.style.backgroundSize = "20px 20px";
                body.style.backgroundPosition = "";
            } else if (mode === 2) {
                // Solid black
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            } else if (mode === 3) {
                // Solid dark gray
                body.style.backgroundColor = "#121212";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            }
        }

        // Apply stored background immediately (before Rive loads)
        let storedBg = localStorage.getItem("page_bg_mode");
        if (storedBg) {
            updatePageBg(parseInt(storedBg));
        }

        const bgRive = new rive.Rive({
          src: "../bg_button.riv",
          canvas: document.getElementById("bg_button_canvas"),
          autoplay: true,
          artboard: "main",
          autoBind: true,
          stateMachines: "State Machine 1",
          onLoad: () => {
            bgRive.resizeDrawingSurfaceToCanvas();
            console.log("[BG] Rive loaded");
            const vmi = bgRive.viewModelInstance;
            console.log("[BG] viewModelInstance:", vmi);
            if (vmi) {
                const bgNum = vmi.number("bgNum");
                console.log("[BG] bgNum property:", bgNum);
                if (bgNum) {
                    // Initialize based on current stored state or default
                    let storedBg = localStorage.getItem("page_bg_mode");
                    let mode = storedBg ? parseInt(storedBg) : 1;
                    bgNum.value = mode;
                    updatePageBg(mode);
                    console.log("[BG] Initial mode set to:", mode, "bgNum.value:", bgNum.value);

                    // Listen for changes from Rive
                    bgNum.onValueChanged = (val) => {
                        console.log("[BG] onValueChanged fired:", val);
                        updatePageBg(val);
                        localStorage.setItem("page_bg_mode", String(val));
                    };

                    // Polling fallback: check bgNum.value periodically
                    let lastVal = bgNum.value;
                    setInterval(() => {
                        const cur = bgNum.value;
                        if (cur !== lastVal) {
                            console.log("[BG] poll detected change:", lastVal, "->", cur);
                            lastVal = cur;
                            updatePageBg(cur);
                            localStorage.setItem("page_bg_mode", String(cur));
                        }
                    }, 200);
                }
            }
          } }); 
      })();
    </script>
    
    <div class="animation-container">
      <canvas id="main_canvas" width="393" height="620"></canvas>
      <div class="description">
        <div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; margin-top: 16px; gap: 12px;">
            <button id="btn_main" class="rive-btn">Trigger</button>
            
        <div class="range-control" style="width:395px;--slider-progress:31.5789%;">
            <output for="btn_main_input0">35</output>
            <span class="range-ticks" aria-hidden="true"></span>
            <input type="range" id="btn_main_input0" value="35" min="5" max="100" step="1" aria-label="goal" />
            <span class="range-hint" aria-hidden="true">goal</span>
            <span class="range-bound range-min">5</span>
            <span class="range-bound range-max">100</span>
        </div>
        
        <div class="range-control" style="width:395px;--slider-progress:71.7647%;">
            <output for="btn_main_input1">66</output>
            <span class="range-ticks" aria-hidden="true"></span>
            <input type="range" id="btn_main_input1" value="66" min="5" max="90" step="1" aria-label="activeMinutes" />
            <span class="range-hint" aria-hidden="true">activeMinutes</span>
            <span class="range-bound range-min">5</span>
            <span class="range-bound range-max">90</span>
        </div>
        
        <div class="range-control" style="width:395px;--slider-progress:100.0000%;">
            <output for="btn_main_input2">1.0</output>
            <span class="range-ticks" aria-hidden="true"></span>
            <input type="range" id="btn_main_input2" value="1.0" min="0.3" max="1.0" step="0.1" aria-label="size2mult" />
            <span class="range-hint" aria-hidden="true">size2mult</span>
            <span class="range-bound range-min">0.3</span>
            <span class="range-bound range-max">1.0</span>
        </div>
        
          </div>
        </div>
      </div>
    </div>
<script>

const mainRive = new rive.Rive({
  src: "../riv/45_activityring_v4.riv",
  canvas: document.getElementById("main_canvas"),
  autoplay: true,autoBind: true, artboard: "main", stateMachines: "State Machine 1",

  onLoad: () => {
    mainRive.resizeDrawingSurfaceToCanvas();
    const vmi = mainRive.viewModelInstance;
    let inputFieldBtn_Main_0 = document.getElementById("btn_main_input0");
    if (inputFieldBtn_Main_0 && vmi) {
      // Update numeric ViewModel variable
      inputFieldBtn_Main_0.addEventListener("input", () => {
        let val = parseFloat(inputFieldBtn_Main_0.value);
                if (!isNaN(val)) vmi.number("goal").value = val;
                const rangeControl = inputFieldBtn_Main_0.closest(".range-control");
                if (rangeControl) {
                    rangeControl.querySelector("output").value = inputFieldBtn_Main_0.value;
                    const minimum = Number(inputFieldBtn_Main_0.min);
                    const maximum = Number(inputFieldBtn_Main_0.max);
                    const progress = maximum === minimum ? 0 : (inputFieldBtn_Main_0.value - minimum) / (maximum - minimum) * 100;
                    rangeControl.style.setProperty("--slider-progress", `${progress}%`);
                }
      });
      // Set initial value if present
      let initVal = parseFloat(inputFieldBtn_Main_0.value);
      if (!isNaN(initVal)) vmi.number("goal").value = initVal;
    }
    let inputFieldBtn_Main_1 = document.getElementById("btn_main_input1");
    if (inputFieldBtn_Main_1 && vmi) {
      // Update numeric ViewModel variable
      inputFieldBtn_Main_1.addEventListener("input", () => {
        let val = parseFloat(inputFieldBtn_Main_1.value);
                if (!isNaN(val)) vmi.number("activeMinutes").value = val;
                const rangeControl = inputFieldBtn_Main_1.closest(".range-control");
                if (rangeControl) {
                    rangeControl.querySelector("output").value = inputFieldBtn_Main_1.value;
                    const minimum = Number(inputFieldBtn_Main_1.min);
                    const maximum = Number(inputFieldBtn_Main_1.max);
                    const progress = maximum === minimum ? 0 : (inputFieldBtn_Main_1.value - minimum) / (maximum - minimum) * 100;
                    rangeControl.style.setProperty("--slider-progress", `${progress}%`);
                }
      });
      // Set initial value if present
      let initVal = parseFloat(inputFieldBtn_Main_1.value);
      if (!isNaN(initVal)) vmi.number("activeMinutes").value = initVal;
    }
    let inputFieldBtn_Main_2 = document.getElementById("btn_main_input2");
    if (inputFieldBtn_Main_2 && vmi) {
      // Update numeric ViewModel variable
      inputFieldBtn_Main_2.addEventListener("input", () => {
        let val = parseFloat(inputFieldBtn_Main_2.value);
                if (!isNaN(val)) vmi.number("size2mult").value = val;
                const rangeControl = inputFieldBtn_Main_2.closest(".range-control");
                if (rangeControl) {
                    rangeControl.querySelector("output").value = inputFieldBtn_Main_2.value;
                    const minimum = Number(inputFieldBtn_Main_2.min);
                    const maximum = Number(inputFieldBtn_Main_2.max);
                    const progress = maximum === minimum ? 0 : (inputFieldBtn_Main_2.value - minimum) / (maximum - minimum) * 100;
                    rangeControl.style.setProperty("--slider-progress", `${progress}%`);
                }
      });
      // Set initial value if present
      let initVal = parseFloat(inputFieldBtn_Main_2.value);
      if (!isNaN(initVal)) vmi.number("size2mult").value = initVal;
    }
  },
});

document.getElementById("btn_main").addEventListener("click", () => {
    const vmi = mainRive.viewModelInstance;
    if (vmi) {
        const vmTrigger = vmi.trigger("start");
        if (vmTrigger) {
            vmTrigger.trigger();
            return;
        }
    }
    const inputs = mainRive.stateMachineInputs("State Machine 1");
    const smTrigger = inputs && inputs.find(input => input.name === "start");
    if (smTrigger) {
        smTrigger.fire();
    } else {
        console.warn("Trigger not found (view model or state machine): start");
    }
} );

document.querySelectorAll('canvas').forEach(canvas => {
  canvas.style.width = canvas.width + "px";
  canvas.style.height = canvas.height + "px";
});
</script>

    </div>
</body>
</html>
