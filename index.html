    <script>
      (function() {
        function updatePageBg(mode) {
            const body = document.body;
            const label = document.getElementById("bg_debug_label");
            if (label) label.textContent = "bg: " + mode;
            console.log("[BG] updatePageBg called with mode:", mode);
            if (mode === 1) {
                // Checkered pattern
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage =
                    "repeating-conic-gradient(#0f0f0f 0% 25%, transparent 0% 50%)";
                body.style.backgroundSize = "20px 20px";
                body.style.backgroundPosition = "";
            } else if (mode === 2) {
                // Solid black
                body.style.backgroundColor = "#000000";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            } else if (mode === 3) {
                // Solid dark gray
                body.style.backgroundColor = "#121212";
                body.style.backgroundImage = "none";
                body.style.backgroundSize = "";
                body.style.backgroundPosition = "";
            }
        }

        // Apply stored background immediately (before Rive loads)
        let storedBg = localStorage.getItem("page_bg_mode");
        if (storedBg) {
            updatePageBg(parseInt(storedBg));
        }

        const bgRive = new rive.Rive({
          src: "bg_button.riv",
          canvas: document.getElementById("bg_button_canvas"),
          autoplay: true,
          artboard: "main",
          autoBind: true,
          stateMachines: "State Machine 1",
          onLoad: () => {
            bgRive.resizeDrawingSurfaceToCanvas();
            console.log("[BG] Rive loaded");
            const vmi = bgRive.viewModelInstance;
            console.log("[BG] viewModelInstance:", vmi);
            if (vmi) {
                const bgNum = vmi.number("bgNum");
                console.log("[BG] bgNum property:", bgNum);
                if (bgNum) {
                    // Initialize based on current stored state or default
                    let storedBg = localStorage.getItem("page_bg_mode");
                    let mode = storedBg ? parseInt(storedBg) : 1;
                    bgNum.value = mode;
                    updatePageBg(mode);
                    console.log("[BG] Initial mode set to:", mode, "bgNum.value:", bgNum.value);

                    // Listen for changes from Rive
                    bgNum.onValueChanged = (val) => {
                        console.log("[BG] onValueChanged fired:", val);
                        updatePageBg(val);
                        localStorage.setItem("page_bg_mode", String(val));
                    };

                    // Polling fallback: check bgNum.value periodically
                    let lastVal = bgNum.value;
                    setInterval(() => {
                        const cur = bgNum.value;
                        if (cur !== lastVal) {
                            console.log("[BG] poll detected change:", lastVal, "->", cur);
                            lastVal = cur;
                            updatePageBg(cur);
                            localStorage.setItem("page_bg_mode", String(cur));
                        }
                    }, 200);
                }
            }
          } }); 
      })();
    </script>

// Fit.Layout: the fixed axis keeps its CSS size, while an `auto` axis follows the size
// the Rive layout reports through bounds (in artboard units, hence the scale factor).
function autoSizeLayoutCanvas(riveInstance, canvas, autoW, autoH, scale) {
  const sync = (force) => {
    const b = riveInstance.bounds;
    let changed = false;
    if (autoW) {
      const w = (b.maxX - b.minX) * scale;
      if (w > 0 && Math.abs(w - (parseFloat(canvas.style.width) || 0)) > 0.5) {
        canvas.style.width = w + "px";
        changed = true;
      }
    }
    if (autoH) {
      const h = (b.maxY - b.minY) * scale;
      if (h > 0 && Math.abs(h - (parseFloat(canvas.style.height) || 0)) > 0.5) {
        canvas.style.height = h + "px";
        changed = true;
      }
    }
    if (changed || force === true) riveInstance.resizeDrawingSurfaceToCanvas();
    requestAnimationFrame(() => sync());
  };
  // Start from the artboard's own size so a non-hugging artboard keeps its designed size.
  riveInstance.resetArtboardSize();
  sync(true);
  window.addEventListener("resize", () => riveInstance.resizeDrawingSurfaceToCanvas());
  window
    .matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
    .addEventListener("change", () => riveInstance.resizeDrawingSurfaceToCanvas());
}

    canvas: document.getElementById("canvas5"),
    autoplay: true, autoBind: true,artboard: "main", stateMachines: "State Machine 1",
    
    assetLoader: (asset) => {
      const fontFields = {"NovemberLC-Bold": "btn5_input1"};
      if (asset.isFont && fontFields[asset.name]) {
        const field = document.getElementById(fontFields[asset.name]);
        const loadFont = (file) => {
          const name = (file || "").trim();
          if (!name) return;
          fetch("fonts/" + name)
            .then(response => {
              if (!response.ok) throw new Error("HTTP " + response.status);
              return response.arrayBuffer();
            })
            .then(bytes => rive.decodeFont(new Uint8Array(bytes)))
            .then(font => {
              asset.setFont(font);
              font.unref();
            })
            .catch(error => console.error("Failed to load Rive font asset:", name, error));
        };
        loadFont(field && field.value);
        if (field) field.addEventListener("change", () => loadFont(field.value));
        return true;
      }
      return false;
    },

    onLoad: () => {
        r5.resizeDrawingSurfaceToCanvas();
    const vmi = r5.viewModelInstance;
    let inputFieldBtn5_0 = document.getElementById("btn5_input0");

    if (inputFieldBtn6_3 && vmi) {

      inputFieldBtn6_3.addEventListener("input", () => {
        vmi.string("text2").value = inputFieldBtn6_3.value;
      });

  },
});
document.getElementById("btn6").addEventListener("click", () => {
    const currentVmi = r6.viewModelInstance;
    if (currentVmi) {
        const vmTrigger = currentVmi.trigger("start");
        if (vmTrigger) {
            vmTrigger.trigger();
            return;
        }
    }
    const inputs = r6.stateMachineInputs("State Machine 1");
    const smTrigger = inputs && inputs.find(input => input.name === "start");
    if (smTrigger) {
        smTrigger.fire();
    } else {
        console.warn("Trigger not found (view model or state machine): start");
    }
});

const r7 = new rive.Rive({
    src: "riv/77_chartmatrix_v8.riv",
    canvas: document.getElementById("canvas7"),

    layout: new rive.Layout({ fit: rive.Fit.Layout, layoutScaleFactor: 0.508906 }),

        autoSizeLayoutCanvas(r7, document.getElementById("canvas7"), false, true, 0.508906);
    const vmi = r7.viewModelInstance;
    let inputFieldBtn7_0 = document.getElementById("btn7_input0");

      // Set initial value
      vmi.boolean("jumps").value = inputFieldBtn7_0.checked;
    }
    let inputFieldBtn7_1 = document.getElementById("btn7_input1");
    if (inputFieldBtn7_1 && vmi) {
      // Update numeric ViewModel variable

        let val = parseFloat(inputFieldBtn7_1.value);
                if (!isNaN(val)) vmi.number("rowHeight").value = val;
                const rangeControl = inputFieldBtn7_1.closest(".range-control");

                    rangeControl.querySelector("output").value = inputFieldBtn7_1.value;
                    const minimum = Number(inputFieldBtn7_1.min);
                    const maximum = Number(inputFieldBtn7_1.max);
                    const progress = maximum === minimum ? 0 : (inputFieldBtn7_1.value - minimum) / (maximum - minimum) * 100;
                    rangeControl.style.setProperty("--slider-progress", `${progress}%`);
                }
      });
      // Set initial value if present
      let initVal = parseFloat(inputFieldBtn7_1.value);
      if (!isNaN(initVal)) vmi.number("rowHeight").value = initVal;
    }
    let inputFieldBtn7_2 = document.getElementById("btn7_input2");

                    const progress = maximum === minimum ? 0 : (inputFieldBtn7_2.value - minimum) / (maximum - minimum) * 100;
                    rangeControl.style.setProperty("--slider-progress", `${progress}%`);
                }
      });
      // Set initial value if present
      let initVal = parseFloat(inputFieldBtn7_2.value);
      if (!isNaN(initVal)) vmi.number("tapIndex").value = initVal;
    }
  },
});
